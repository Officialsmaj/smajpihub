<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Vite does not use %PUBLIC_URL% -->

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <meta name="title" content="SMAJ PI HUB | The Pi-Powered Super App for Real-World Utility" />
    <meta name="description" content="SMAJ PI HUB is a Pi-powered super app creating real-world utility for the Pi Network ecosystem. Access trusted marketplaces, digital services, opportunities, and global solutions through one verified Pi identity and one Pi wallet." />
    <meta name="keywords" content="SMAJ PI HUB, Pi Network, Pi Utility, Pi Apps, Pi Marketplace, Pi Payments, Pi Ecosystem, Digital Services, Super App, Web3 Utility" />
    <meta name="application-name" content="SMAJ PI HUB" />
    <meta name="apple-mobile-web-app-title" content="SMAJ PI HUB" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta property="og:title" content="SMAJ PI HUB | The Pi-Powered Super App for Real-World Utility" />
    <meta property="og:description" content="A Pi-powered platform connecting verified users to marketplace, services, opportunities, and real-world digital solutions through Pi Network." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smajpihub.com/" />
    <meta property="og:site_name" content="SMAJ PI HUB" />
    <meta property="og:image" content="https://smajpihub.com/logo.png" />
    <meta property="og:image:alt" content="SMAJ PI HUB official logo" />
    <meta name="tagline" content="One Pi Identity. One Wallet. Multiple Services. Real Utility." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SMAJ PI HUB | The Pi-Powered Super App for Real-World Utility" />
    <meta name="twitter:description" content="A Pi-powered platform connecting verified users to marketplace, services, opportunities, and real-world digital solutions through Pi Network." />
    <meta name="twitter:image" content="https://smajpihub.com/logo.png" />
    <meta name="twitter:image:alt" content="SMAJ PI HUB official logo" />
    <link rel="canonical" href="https://smajpihub.com/" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SMAJ PI HUB",
        "alternateName": "SMAJ PI HUB",
        "url": "https://smajpihub.com/"
      }
    </script>

    <!--
    Runtime environment variables
    These values are:
    - replaced in DEV by Vite (via import.meta.env if needed)
    - replaced in PROD by Docker entrypoint (string replace)
  -->
    <script>
      window.__ENV = {
        apiBaseURL: "$$API_BASE_URL$$",
        backendURL: "$$BACKEND_URL$$",
        sandbox: "$$SANDBOX_SDK$$",
      };
      window.__SMAJ_BUILD = "%VITE_BUILD_ID%";
    </script>

    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Google AdSense site verification and ad loader -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5794291397799733"
      crossorigin="anonymous"
    ></script>

    <script>
      const runSDKInSandboxMode =
        window.__ENV.sandbox === "true" ||
        window.location.hostname === "sandbox.minepi.com" ||
        document.referrer.includes("sandbox.minepi.com");
      if (window.Pi?.init) {
        window.Pi.init({
          version: "2.0",
          sandbox: runSDKInSandboxMode,
        });
      } else {
        console.warn("Pi SDK not available at startup; app will continue without immediate Pi init.");
      }
    </script>

    <title>SMAJ PI HUB | The Pi-Powered Super App for Real-World Utility</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- Vite entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
