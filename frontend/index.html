<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Vite does not use %PUBLIC_URL% -->

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="SMAJ PI HUB is a Pi-powered digital platform creating real-world utility for the Pi Network ecosystem. Access marketplace, services, opportunities, and digital solutions through one verified Pi identity and one Pi wallet." />
    <meta name="keywords" content="SMAJ PI HUB, Pi Network, Pi Utility, Pi Marketplace, Digital Economy, Pi Payments, Verified Digital Services" />
    <meta property="og:title" content="SMAJ PI HUB | The Unified Pi-Powered Digital Platform" />
    <meta property="og:description" content="SMAJ PI HUB is a Pi-powered digital platform creating real-world utility for the Pi Network ecosystem. Access marketplace, services, opportunities, and digital solutions through one verified Pi identity and one Pi wallet." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smajpihub.com" />
    <meta property="og:image" content="https://smajpihub.com/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SMAJ PI HUB | The Unified Pi-Powered Digital Platform" />
    <meta name="twitter:description" content="SMAJ PI HUB is a Pi-powered digital platform creating real-world utility for the Pi Network ecosystem. Access marketplace, services, opportunities, and digital solutions through one verified Pi identity and one Pi wallet." />
    <meta name="twitter:image" content="https://smajpihub.com/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!--
    Runtime environment variables
    These values are:
    - replaced in DEV by Vite (via import.meta.env if needed)
    - replaced in PROD by Docker entrypoint (string replace)
  -->
    <script>
      window.__ENV = {
        backendURL: "$$BACKEND_URL$$",
        sandbox: "$$SANDBOX_SDK$$",
      };
    </script>

    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <script>
      const runSDKInSandboxMode = window.__ENV.sandbox === "true";
      if (window.Pi?.init) {
        window.Pi.init({
          version: "2.0",
          sandbox: runSDKInSandboxMode,
        });
      } else {
        console.warn("Pi SDK not available at startup; app will continue without immediate Pi init.");
      }
    </script>

    <title>SMAJ PI HUB | The Unified Pi-Powered Digital Platform</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- Vite entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
